<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login in</title>
</head>

<body>
    <form>
        <label for="name">Name</label> <br>
        <input type="text" placeholder="enter your name" id="name" required> <br><br>

        <label for="lastname">Last name</label> <br>
        <input type="text" placeholder="enter your last name" id="lastname" required> <br> <br>

        <label for="birth date">birth data time</label> <br>
        <input type="datetime-local" placeholder=your birth data time id="birth data" name="birth data"> <br><br>

        <label for="gender">Choose your gender</label> <br>
        <select name="gender" id="gender">
            <option value="male">male</option>
            <option value="female">female</option>
            <option value="other">other</option>
            <option value="rather not say">rather not say</option required> <br><br>
        </select> <br> <br>

        <label for="email">Email</label> <br>
        <input type="email" placeholder="enter your email" id="email" required> <br> <br>

        <label for="password">Password</label> <br>
        <input type="password" placeholder="enter your password" id="password" required> <br> <br>

        <p>which programming languages you know</p>

        <input type="radio" name="programming languages you know" id="html" value="html">
        <label for="html">html</label> <br>

        <input type="radio" name="programming languages you know" id="css" value="css">
        <label for="css">css</label> <br>

        <input type="radio" name="programming languages you know" id="javascript" value="javascript">
        <label for="javascript">javascript</label> <br>

        <input type="radio" name="programming languages you know" id="neither" value="neither">
        <label for="neither">neither</label> <br><br>

        <button type="submit">submit</button>

    </form>
</body>

</html>
