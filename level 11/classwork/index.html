<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign in</title>
</head>

<body>
    <form>
        <label for="name">Name</label> <br><br>
        <input type="text" id="name" required>
        <br><br>
        <label for="lastname">lastname</label> <br><br>
        <input type="text" id="lastname" required>
        <br><br>
        <label for="email">email</label> <br><br>
        <input type="email" id="email" required>
        <br><br>
        <label for="password">password</label> <br><br>
        <input type="password" id="password" required>
        <br><br>
        <p>choose gender</p>
        <input type="radio" name="choose gender" id="male" value="male">
        <label for="male">male</label>
        <br><br>
        <input type="radio" name="choose gender" id="female" value="female">
        <label for="female">female</label>
        <br><br>
        <input type="radio" name="choose gender" id="other" value="other">
        <label for="other">other</label>
        <br><br>
        <button type="submit">submit</button>
    </form>
</body>

</html>
